# 테스트 전용 설정임
#
# *이 파일은 src/main/resources/application.yml 을 덮어쓰는 것이 아니라 통째로 가림
#   클래스패스에서 application.yml 을 하나만 찾는데
#   Gradle 테스트에서는 build/resources/test 가 앞서기 때문임
#   따라서 main 쪽에 있던 값도 여기 필요하면 다시 적어야 함
#   main 에 있는 세 줄 중 spring.application.name 과 spring.profiles.default 를 다시 적었고
#   spring.config.import 는 아래에서 설정 서버를 끄므로 적지 않음
#
# *템플릿에 있던 jpa · flyway · kafka 값은 뺐음
#   이 서비스는 DB 와 이벤트 의존성을 걷어내 그 값을 읽는 자동 설정이 올라오지 않음

spring:
  application:
    # 가려진 main 쪽 값을 다시 적은 것임
    # 없으면 로그의 appName 과 유레카 등록 이름이 unknown 이 됨
    name: extract-service

  profiles:
    # 가려진 main 쪽 값을 다시 적은 것임
    # logback-spring.xml 이 이 값으로 갈림
    #   local 이면 콘솔만, local 이 아니면 Loki appender 가 붙음
    # 없으면 프로파일이 default 가 되어 테스트가 Loki 로 로그를 밀어 보내려 하고
    # 로컬에 Loki 가 없으면 ConnectException 스택트레이스가 로그를 뒤덮음
    default: local

  cloud:
    config:
      # 테스트가 설정 서버 기동 여부에 따라 갈리면 안 되므로 끔
      # main 쪽 import 에 optional 이 붙어 있어 꺼도 기동은 정상임
      enabled: false

eureka:
  client:
    # 테스트는 서비스 디스커버리에 참여하지 않음
    # 켜 두면 등록을 시도하다 실패해 로그가 뒤덮임
    enabled: false

app:
  extract:
    # 실행 루프 (ExtractProperties) — 값은 config 저장소 extract-service.yml 과 같게 둠
    # 없으면 ExtractProperties 의 검증에 걸려 contextLoads 가 깨짐
    chunk-size: 100
    max-consecutive-failures: 5
    policy:
      read-timeout-seconds: 60

    # 조건을 읽는 언어 모델 (LlmProperties)
    #
    # 테스트는 모델을 부르지 않으므로 검증을 통과할 값만 둠
    # 설정 서버를 꺼서 config 저장소 값이 안 내려오므로, 없으면 LlmProperties 의 검증에 걸려
    # contextLoads 가 그 자리에서 깨짐
    # 값은 config 저장소 extract-service.yml 과 같게 둠
    # 다만 provider 는 키 없이 뜨도록 ollama 로 둠 — config 는 openai 라 키가 없으면 기동이 실패함
    llm:
      provider: ollama
      max-retries: 3
      retry-backoff-ms: 1000
      ollama:
        base-url: http://localhost:11434
        model: qwen3.8:27b
        think: false
        num-ctx: 16384
        num-predict: 2048
        temperature: 0
        seed: 42
        timeout-seconds: 120
      openai:
        base-url: https://api.openai.com/v1
        model: gpt-5.6-luna
        reasoning-effort: medium
        # provider 가 ollama 면 검사하지 않음
        # 정확도 평가를 OpenAI 로 돌릴 때만 환경변수에서 받아 씀 (./gradlew llmEval "-Dapp.extract.llm.provider=openai")
        # 키를 명령줄이나 이 파일에 적지 않기 위해서임
        api-key: ${OPENAI_API_KEY:}
        timeout-seconds: 60

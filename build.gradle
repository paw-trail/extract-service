plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pawtrail'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()

    // 공통 모듈(com.pawtrail:common)은 GitHub Packages 에 배포돼 있음
    // 내려받으려면 GPR_USER, GPR_TOKEN 환경변수가 설정돼 있어야 함
    // 설정 방법은 README 의 "공통 모듈 가져오기" 절을 참고
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/paw-trail/common")
        credentials {
            username = System.getenv("GPR_USER")
            password = System.getenv("GPR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    // ── 공통 모듈 ─────────────────────────────────────────────
    // 버전은 gradle.properties 의 commonVersion 에 있음
    // 새 버전이 나오면 그 값만 바꾸고 다시 빌드하면 됨
    // 내려받기에 필요한 인증은 위 repositories 블록에 있음
    implementation "com.pawtrail:common:${commonVersion}"

    // 공통 모듈의 PageResponse 가 org.springframework.data.domain.Page 를 씀
    // starter-data-redis 가 전이로 끌어오지만 그러면 페이징이 캐시 의존성에 매달리므로
    // 직접 선언함
    // DB 를 쓰지 않는 서비스도 목록 응답을 반환하므로 이 줄은 남길 것
    implementation 'org.springframework.data:spring-data-commons'

    // ── 웹 · 검증 · 보안 · 상태확인 ────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── 데이터 · 캐시 · 이벤트 ───────────────────────────────
    // 템플릿의 데이터 블록(DB · 좌표 · 쿼리 도구)과 캐시 · 이벤트 두 줄을 통째로 뺐음
    //
    // * DB 가 없음
    //   어디까지 처리했는지는 ingest 가 가진 원문의 상태가 맡고
    //   뽑은 조건은 policy 로 넘기므로 이 서비스가 담아 둘 표가 없음
    //
    // * 이벤트를 내지도 받지도 않음
    //   조건이 바뀌었다는 알림은 policy 가 병합한 뒤 자기 이벤트로 냄
    //
    // * 캐시 서버를 쓰지 않음
    //   같은 문장을 다시 읽지 않게 하는 재사용은 한 실행 안의 메모리로 충분함
    //   의존성만 있어도 자동 설정이 켜져 상태 확인이 그 연결에 매달림 (place v0.1.0 에서 겪음)
    //
    // * 함께 지운 곳
    //   아래 테스트 블록의 짝 · 테스트용 데이터베이스 블록 · 앱 클래스의 애노테이션 두 줄
    //   gradle.properties 의 두 버전 값

    // ── Spring Cloud ──────────────────────────────────────────
    // 회로 차단기 스타터를 뺐음
    // 재시도는 ingest 처럼 손으로 짠 반복으로 하고 회로 차단기는 쓰지 않음
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // ── 관측 ──────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    runtimeOnly   'io.micrometer:micrometer-registry-prometheus'

    // ── API 문서 ──────────────────────────────────────────────
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // ── Lombok ────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-zipkin-test'

    testCompileOnly       'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능 jar 하나만 만듦
// 켜 두면 -plain.jar 가 함께 생기는데, 클래스만 든 4KB 짜리라 실행되지 않음
//
// * Dockerfile 이 COPY build/libs/*.jar 로 받으므로 둘이 있으면 어느 쪽이 담길지가
//   빌드 도구의 파일 정렬 순서에 달림
//   지금은 우연히 실행 가능한 쪽이 뒤에 와서 동작하나, 이름이 조금만 달라져도 뒤집힘
//   기동에 실패해야 드러나므로 이미지를 만드는 시점에는 알 수 없음
//
// * 공통 모듈은 반대로 이것을 켜고 bootJar 를 끔
//   그쪽은 실행되는 앱이 아니라 다른 프로젝트가 의존성으로 쓰는 라이브러리이기 때문임
tasks.named('jar') {
    enabled = false
}

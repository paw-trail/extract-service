<rect x="314" y="306" width="234" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="318" font-size="13" font-weight="normal" text-anchor="start" fill="#3B82F6">POST /internal/extract/trigger  → 202</text>

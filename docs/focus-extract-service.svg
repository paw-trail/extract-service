<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">extract-service  :8089</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">원문에서 반려동물 동반 조건을 읽어 policy 에 넣음</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 1개  (internal 트리거) · DB 없음</text>
<text x="622.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="55.0" y="285.0" width="250" height="90" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2"/>
<text x="180" y="308" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">운영자</text>
<text x="180" y="328" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">전량 · 다시 뽑기를 부름</text>
<text x="180" y="344" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">limit 로 몇 건만도 됨</text>
<rect x="55.0" y="555.0" width="250" height="90" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="578" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Jenkins 잡</text>
<text x="180" y="598" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">수집 뒤에 이어 부름</text>
<text x="180" y="614" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="660.0" y="80.0" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · 청크 · 모델 설정</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="270.0" width="300" height="100" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2"/>
<text x="1560" y="298" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">OpenAI  gpt-5.6-luna</text>
<text x="1560" y="318" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">같은 조각을 두 번 읽음</text>
<text x="1560" y="334" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">추론 medium · high</text>
<rect x="1410.0" y="460.0" width="300" height="80" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1560" y="486" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Ollama  qwen3.8:27b</text>
<text x="1560" y="506" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">로컬 모델 · 비교 · 시험용</text>
<rect x="1410.0" y="645.0" width="300" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="670" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">policy-service</text>
<text x="1560" y="690" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">소스마다 한 벌씩 받아</text>
<text x="1560" y="706" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소마다 한 벌로 합쳐 둠</text>
<text x="1560" y="722" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조건 20칸 · 근거 · 충돌</text>
<rect x="650.0" y="725.0" width="340" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="820" y="750" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">ingest-service</text>
<text x="820" y="770" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">원문 raw_db</text>
<text x="820" y="786" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소에 이어진 대기 원문을 줌</text>
<text x="820" y="802" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">처리 결과를 상태로 받음</text>

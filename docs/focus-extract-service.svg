<text x="1142" y="205" font-size="13" font-weight="normal" text-anchor="start" fill="#6366F1">등록</text>
<polyline points="1010,450 1170,450 1170,320 1410.0,320" fill="none" stroke="#A855F7" stroke-width="2.4" marker-end="url(#ah-A855F7)"/>
<rect x="1178" y="376" width="209" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1182" y="388" font-size="13" font-weight="normal" text-anchor="start" fill="#A855F7">POST /v1/chat/completions  두 번</text>
<polyline points="1010,470 1210,470 1210,500 1410.0,500" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="1258" y="478" width="82" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1262" y="490" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">ollama 일 때</text>
<polyline points="1010,490 1250,490 1250,700 1410.0,700" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1258" y="628" width="240" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1262" y="640" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">POST /internal/policies/bulk   청크 100</text>
<polyline points="820,505.0 820,725.0" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="828" y="628" width="295" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="832" y="640" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/raw · PATCH /internal/raw/status</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">정형 칸은 규칙이, 문장은 모델이 읽음 — 모델 값에는 늘 원문 조각 번호로 근거가 붙고, 번호가 원문에 없으면 값을 버림</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">같은 조각을 추론 medium · high 로 두 번 읽어 칸마다 좁은 쪽을 남김 · 정형 칸과 본문이 갈리면 그 칸을 비우고 소스 내 충돌로 보냄</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">DB 없음 — 어디까지 했는지는 ingest 원문 상태가 맡음 · 트리거는 바로 202 · 결과는 실행 끝의 요약 로그 한 줄</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">extract-service 를 중심으로 · 직접 연결된 것만</text></svg>